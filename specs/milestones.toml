# Milestones: what ships in what order. Enforced in CI by .agents/scripts/check_gates.py.
# Agents pick the first ready feature in this file's order whose assignee is theirs (see Lanes in AGENTS.md):
# milestones top to bottom, features left to right. A spec in no milestone is backlog and is never picked.
#
# ship    "+H:MM" after start · "YYYY-MM-DD" (through the end of that day, UTC) · an ISO time with offset · "" = none
# freeze  "H:MM" or "2d" before ship: only this milestone's features (and `allow`) merge as feat; fixes still merge.
# final   the last milestone: from `report_before`, only fixes, reverts, docs and `allow`; at ship, nothing merges.
# The bootstrap feature always merges before any other feature.
#
# No deadlines on purpose (decision 001, row 15): start is empty, so "+H:MM" times are off and the milestones with
# ship = "" have no deadline. The one exception is Eric's (2026-10-25): submission ships at the Devpost deadline,
# an absolute time that needs no start. From 4:00 PM ET only fixes, reverts and docs merge; from 5:00 PM, nothing.
start = ""

[[milestone]]
name = "playable"
ship = ""
features = ["core-loop"]
cut = []

