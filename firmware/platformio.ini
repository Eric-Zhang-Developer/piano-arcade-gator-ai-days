; Optional: build and flash with PlatformIO instead of the Arduino IDE.
;   pio run -t upload && pio device monitor
[platformio]
src_dir = piano_leds

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED@^3.9.0
monitor_speed = 115200
upload_speed = 460800
