# Make `ci` a required check on main. Keep it fast: a slow CI caps how fast anything merges.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited: fixing a PR title reruns the checks
  push:
    branches: [main]
  # The full browser suite: every 30 min on main, and by hand (Actions > ci > Run workflow). A PR and a push run the
  # smoke check only (decision ci-browser-pr-scope.md, Eric 2026-10-25).
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  # A full run has its own group, so it never cancels or queues behind a push's run.
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-full' || '' }}
  # A PR cancels its superseded run. Main doesn't: a steady stream of merges cancelled every main run (none finished
  # in ~15 merges after c2bb006). The running one finishes, and GitHub keeps only the newest pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: github.event_name == 'pull_request' || github.event_name == 'push'  # a full run is browser checks only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Spec lint
        run: python3 .agents/scripts/check_ownership.py --lint-specs

      - name: Ownership, gates, markers (PR)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          python3 .agents/scripts/check_ownership.py --title "$TITLE" --base "$BASE"
          python3 .agents/scripts/check_gates.py --title "$TITLE" --base "$BASE"
          python3 .agents/scripts/check_markers.py --base "$BASE"

      - name: Markers (main)
        if: github.event_name == 'push'
        run: python3 .agents/scripts/check_markers.py --all

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm -C web install --frozen-lockfile
      - name: Project checks
        run: pnpm -C web lint && pnpm -C web typecheck && pnpm -C web test && pnpm -C web build

  plan:
    # How many browser shards this run needs: one per 3 checks, 1 to 8. Every run used to take 8 runners, even a PR
    # whose changes pick 2 checks, and GitHub's job limit queued main 20+ min. Every check (main) gets 8, ~10.5 min of
    # checks each (balanced by seconds). 16 was tried: two 16-shard PRs held 32 of ~40 runners and main queued 15+ min
    # (Eric, 2026-10-25: PRs run only their folders' checks, and the cap is 8 for everyone).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5  # run-checks.mjs needs Map.groupBy (Node 21+); the runner's default is older
        with:
          node-version: 24
      - name: Plan
        id: plan
        env:
          SCOPE: ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.event.pull_request.base.ref) || github.event_name == 'push' && format('--base {0}', github.event.before) || '--all' }}
        run: |
          args="$SCOPE"
          count="$(node web/e2e/run-checks.mjs --list $args | awk 'NF { c++ } END { print c + 0 }')"
          n=$(( (count + 2) / 3 )); n=$(( n < 1 ? 1 : n > 8 ? 8 : n ))
          echo "$count check(s) -> $n shard(s)"
          echo "shards=$(jq -nc --argjson n "$n" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  browser:
    # The headless game checks on GitHub's CPU (specs/features/ci-browser/spec.md): verify.mjs plus the checks a PR's
    # changes need, every check on main, over the shards `plan` picked. Each check still starts its own server (phase 1).
    name: browser (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:  # read-only: the operator board and replay read PRs, issues and runs through gh
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
      statuses: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}  # at most 8 (plan): 4 left one all-checks shard at 18.75 of 20 min (#415)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Select
        id: select
        env:
          SCOPE: ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.event.pull_request.base.ref) || github.event_name == 'push' && format('--base {0}', github.event.before) || '--all' }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          args="$SCOPE --shard $SHARD"
          list="$(node web/e2e/run-checks.mjs --list $args)"
          echo "${list:-no checks in this shard}"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          if [ -n "$list" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        if: steps.select.outputs.any == 'true'
        run: |
          pnpm -C web install --frozen-lockfile
          echo "PLAYWRIGHT_VERSION=$(node -p "require('./web/node_modules/playwright/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: steps.select.outputs.any == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Chromium
        if: steps.select.outputs.any == 'true'
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Checks
        if: steps.select.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/e2e/run-checks.mjs ${{ steps.select.outputs.args }} --out "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore

  ci-red:
    # A red full run files or updates one issue (labels bug, ci-red) naming the failing checks and the commits since the
    # last green full run. Not main-red: it doesn't freeze merges; fix forward (decision ci-browser-pr-scope.md).
    needs: browser
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.browser.result == 'failure' || needs.browser.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-evidence-*
          path: evidence
      - name: File or update the ci-red issue
        env:
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed="$(cat evidence/*/results.json 2>/dev/null | jq -r '.rows[] | select(.result == "FAIL") | "- `\(.check)`"' | sort -u)"
          shards="$(gh run view "$RUN" --json jobs --jq '.jobs[] | select((.name | startswith("browser")) and (.conclusion == "failure" or .conclusion == "cancelled")) | "\(.name): \(.conclusion)"' | paste -sd ',' - | sed 's/,/, /g')"
          green="$(gh run list --workflow ci --branch main --limit 100 --json event,conclusion,headSha --jq '[.[] | select((.event == "schedule" or .event == "workflow_dispatch") and .conclusion == "success")][0].headSha // empty')"
          range="${green:+[${green:0:7}...${SHA:0:7}](${{ github.server_url }}/${{ github.repository }}/compare/$green...$SHA)}"
          body="$(printf 'Full browser run [%s](%s) at %s is red.\n\n**Failing checks:**\n%s\n\n**Shards:** %s\n\n**Commits since the last green full run:** %s\n\nNot main-red: merges continue. Fix forward (decision ci-browser-pr-scope.md).' "$RUN" "$URL" "${SHA:0:7}" "${failed:-none recorded (a shard was cut short; see the run)}" "${shards:-none}" "${range:-no green full run yet}")"
          gh label create ci-red --color B60205 --description "The scheduled full browser run is red; doesn't block merges" 2>/dev/null || true
          n="$(gh issue list --label ci-red --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --label bug --label ci-red --title "ci-red: the full browser run is red" --body "$body"; fi

  issues:
    # After a merge: one issue per feature spec (closed when done), one GitHub milestone per milestone, and a
    # fresh pinned Status issue.
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: issue-sync
      cancel-in-progress: false
    permissions:
      issues: write
      contents: read
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 .agents/scripts/sync_issues.py
      - run: python3 .agents/scripts/status.py --issue
