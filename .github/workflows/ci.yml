# Make `ci` a required check on main. Keep it fast: a slow CI caps how fast anything merges.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited: fixing a PR title reruns the checks
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A PR cancels its superseded run. Main doesn't: a steady stream of merges cancelled every main run (none finished
  # in ~15 merges after c2bb006). The running one finishes, and GitHub keeps only the newest pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Spec lint
        run: python3 .agents/scripts/check_ownership.py --lint-specs

      - name: Ownership, gates, markers (PR)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          python3 .agents/scripts/check_ownership.py --title "$TITLE" --base "$BASE"
          python3 .agents/scripts/check_gates.py --title "$TITLE" --base "$BASE"
          python3 .agents/scripts/check_markers.py --base "$BASE"

      - name: Markers (main)
        if: github.event_name == 'push'
        run: python3 .agents/scripts/check_markers.py --all

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm -C web install --frozen-lockfile
      - name: Project checks
        run: pnpm -C web lint && pnpm -C web typecheck && pnpm -C web test && pnpm -C web build

  plan:
    # How many browser shards this run needs: one per 3 checks, 1 to 8. Every run used to take 8 runners, even a PR
    # whose changes pick 2 checks, and GitHub's job limit queued main 20+ min. Every check (main) still gets 8.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5  # run-checks.mjs needs Map.groupBy (Node 21+); the runner's default is older
        with:
          node-version: 24
      - name: Plan
        id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
        run: |
          if [ -n "$BASE" ]; then args="--base $BASE"; else args="--all"; fi
          count="$(node web/e2e/run-checks.mjs --list $args | awk 'NF { c++ } END { print c + 0 }')"
          n=$(( (count + 2) / 3 )); n=$(( n < 1 ? 1 : n > 8 ? 8 : n ))
          echo "$count check(s) -> $n shard(s)"
          echo "shards=$(jq -nc --argjson n "$n" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  browser:
    # The headless game checks on GitHub's CPU (specs/features/ci-browser/spec.md): verify.mjs plus the checks a PR's
    # changes need, every check on main, over the shards `plan` picked. Each check still starts its own server (phase 1).
    name: browser (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:  # read-only: the operator board and replay read PRs, issues and runs through gh
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
      statuses: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}  # at most 8: 4 left one all-checks shard at 18.75 of 20 min (#415)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Select
        id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          if [ -n "$BASE" ]; then args="--base $BASE --shard $SHARD"; else args="--all --shard $SHARD"; fi
          list="$(node web/e2e/run-checks.mjs --list $args)"
          echo "${list:-no checks in this shard}"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          if [ -n "$list" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        if: steps.select.outputs.any == 'true'
        run: |
          pnpm -C web install --frozen-lockfile
          echo "PLAYWRIGHT_VERSION=$(node -p "require('./web/node_modules/playwright/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: steps.select.outputs.any == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Chromium
        if: steps.select.outputs.any == 'true'
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Checks
        if: steps.select.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/e2e/run-checks.mjs ${{ steps.select.outputs.args }} --out "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore

  issues:
    # After a merge: one issue per feature spec (closed when done), one GitHub milestone per milestone, and a
    # fresh pinned Status issue.
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: issue-sync
      cancel-in-progress: false
    permissions:
      issues: write
      contents: read
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 .agents/scripts/sync_issues.py
      - run: python3 .agents/scripts/status.py --issue
